services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "0.0.0.0:5173:8787"
    depends_on:
      template-service:
        condition: service_healthy
    restart: unless-stopped

  # Every uploaded PDF is configuration in this shared service, not a new deployment.
  template-service:
    build:
      context: ./backend
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "app.template_main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TEMPLATE_DATABASE_URL: postgresql+psycopg://templates:${FAULT_REPORT_DB_PASSWORD:?Set FAULT_REPORT_DB_PASSWORD in .env}@template-db:5432/templates
    ports:
      - "0.0.0.0:8001:8000"
    depends_on:
      template-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  template-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: templates
      POSTGRES_USER: templates
      POSTGRES_PASSWORD: ${FAULT_REPORT_DB_PASSWORD:?Set FAULT_REPORT_DB_PASSWORD in .env}
    volumes:
      - template-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templates -d templates"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  template-postgres:
