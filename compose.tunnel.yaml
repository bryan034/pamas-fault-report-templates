# Optional named tunnel. Authentication is owned by Python, not Cloudflare Access.
services:
  web:
    networks: [default, protected-tunnel]

  word-gateway:
    networks: [default, protected-tunnel]

  template-service:
    networks: [default, protected-tunnel]
    environment:
      TEMPLATE_ACCESS_MODE: google
      TEMPLATE_OWNER_EMAIL: ${TEMPLATE_OWNER_EMAIL:?Set the main owner email in .env.tunnel}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the Google OAuth client secret}
      TEMPLATE_PUBLIC_ORIGIN: ${TEMPLATE_PUBLIC_ORIGIN:?Set the HTTPS origin in .env.tunnel}
      TEMPLATE_AUTH_ORIGIN: ${TEMPLATE_PUBLIC_ORIGIN:?Set the HTTPS origin in .env.tunnel}

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set the tunnel token in .env.tunnel}
    depends_on:
      word-gateway:
        condition: service_started
      web:
        condition: service_started
      template-service:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    # Do not attach to the base development network. Recreating services with
    # only compose.yaml removes this connection rather than exposing local mode.
    networks: [protected-tunnel]

networks:
  protected-tunnel:
