# HTTP only. Cloudflare terminates public HTTPS; no local CA/certificates.
map $http_upgrade $report_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    # Vite HMR uses WebSockets during live-mounted development.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $report_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_buffering off;

    # Do not pass caller-supplied private gateway credentials to the API.
    proxy_set_header X-Template-Service-Token "";
    proxy_set_header X-Template-User-Email "";
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    proxy_hide_header Cache-Control;

    location /api/ {
        proxy_pass http://template-service:8000;
    }

    # The converter is private; no embedded Word editor is exposed.
    location = /onlyoffice { return 404; }
    location /onlyoffice/ { return 404; }

    location / {
        proxy_pass http://web:8787;
    }
}
