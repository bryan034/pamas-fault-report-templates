# Local application gateway. Word conversion is private and server-side only.
map $http_upgrade $word_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $word_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $word_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $word_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    # Document conversion is private; browser routes are served by the application.
    location = /onlyoffice { return 404; }
    location /onlyoffice/ { return 404; }
    location /api/ { proxy_pass http://template-service:8000; }
    location / { proxy_pass http://web:8787; }
}
